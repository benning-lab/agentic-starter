name: check

# Everything in this repo is executed on someone's machine, so the bar is that it
# parses and that the things with behaviour actually run. A syntax check alone is
# not verification — see skills/README.md — so the scaffolder and the corpus
# builder are run for real against a temporary directory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Shell syntax
        run: |
          for f in install.sh bin/*.sh hooks/*.sh; do
            bash -n "$f" && echo "ok   $f"
          done
          zsh -n dotfiles/shell-cc.zsh && echo "ok   dotfiles/shell-cc.zsh"

      - name: Python syntax
        run: python3 -m py_compile hooks/condense-transcript.py skills/build-corpus.py

      - name: JSON is valid
        run: python3 -c "import json; json.load(open('settings.template.json')); print('ok   settings.template.json')"

      - name: Scaffolder runs, and is idempotent
        run: |
          tmp=$(mktemp -d)
          ./bin/new-project.sh "$tmp/2026_Example" --name "Example" --code ex
          for f in CLAUDE.md PROJECT_INDEX.md TODO.md; do
            test -s "$tmp/2026_Example/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q "Example" "$tmp/2026_Example/CLAUDE.md" || { echo "name not substituted"; exit 1; }
          ./bin/new-project.sh "$tmp/2026_Example" | grep -q "0 written, 3 skipped" \
            || { echo "re-run should skip everything"; exit 1; }
          echo "ok   scaffolder"

      - name: Installer dry run changes nothing
        run: |
          before=$(find "$HOME" -maxdepth 3 -path "$HOME/.claude*" 2>/dev/null | sort)
          ./install.sh --check > /dev/null
          after=$(find "$HOME" -maxdepth 3 -path "$HOME/.claude*" 2>/dev/null | sort)
          test "$before" = "$after" || { echo "--check modified something"; exit 1; }
          echo "ok   install.sh --check"

      - name: Corpus builder ligature check works
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("bc", "skills/build-corpus.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          bad = m.ligature_report("The eect of condence on tness was clear.")
          good = m.ligature_report("The effect of confidence on fitness was clear.")
          assert any(n_bad for _, _, n_bad in bad), "detector missed mangled text"
          assert not any(n_bad for _, _, n_bad in good), "detector false-positived on clean text"
          print("ok   ligature detector")
          PY
