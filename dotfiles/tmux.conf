# tmux config for running Claude Code in long-lived sessions.
# Symlink to ~/.tmux.conf.
#
# The reason to bother: tmux owns the terminal, not the application you are
# looking at, so a Claude Code session keeps running when you switch windows,
# close the terminal, or walk away. One window per project, all of them alive.

# --- general ---
set -g mouse on                       # click panes/windows, scroll, drag-resize
set -g history-limit 100000           # big scrollback
set -g base-index 1                   # windows start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on            # keep window numbers gapless after closing
set -sg escape-time 10                # snappier ESC (helps vim/claude TUI)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough
set -as terminal-features ",xterm-ghostty:RGB"  # truecolor when the outer terminal is Ghostty (TERM=xterm-ghostty)

# --- clipboard (macOS): mouse drag-select copies straight to the system clipboard ---
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# Double/triple-click select word/line, also -> clipboard
bind -T copy-mode    DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# --- pane navigation: Alt+arrow, no prefix ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- window navigation: Shift+arrow, no prefix ---
bind -n S-Left  previous-window
bind -n S-Right next-window

# --- splits keep current dir; friendlier keys ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- reload config ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- status bar ---
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left "#[bold] #S #[default]| "
set -g status-left-length 30
set -g status-right "%a %d %b  %H:%M "
setw -g window-status-current-style "bold,fg=colour16,bg=colour39"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
